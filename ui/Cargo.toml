[package]
name = "gemini-ui"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.14.0", features = ["markdown", "highlighter", "svg", "image", "canvas", "tokio"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = { version = "5", default-features = false, features = ["tokio"] }
